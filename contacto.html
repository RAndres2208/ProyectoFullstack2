<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="./js/main.js"></script>
    <link rel="icon" type="image/x-icon" href="favicon.jpg">
</head>


<body>

    <header>
        <h1 class="header">Contacto</h1>
    </header>

    <main>
        <div class="row">

            <div class="col-3">
                <nav class="menu">
                    <h2>Menú</h2>

                    <ul>
                        <li><a href="index.html">Inicio</a></li>
                        <li><a href="productos.html">Productos</a></li>
                        <li><a href="carrito.html">Carrito</a></li>
                        <li><a href="contacto.html">Contacto</a></li>
                    </ul>
                </nav>
            </div>

            <div class="col-6">

                <section class="productos">

                    <h2>Formulario de contacto</h2>

                    <form>

                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" autocomplete="name">

                        <br><br>

                        <label for="correo">Correo:</label>
                        <input type="email" id="correo" name="correo" autocomplete="email">

                        <br><br>

                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" autocomplete="tel">

                        <br><br>

                        <label for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje"></textarea>

                        <br><br>

                        <button type="submit">Enviar</button>

                    </form>

                </section>

            </div>

        </div>
    </main>

    <footer>
        <p>Robinson Rodriguez</p>
        <p>Proyecto Fullstack 2026</p>
    </footer>

</body>

</html>
