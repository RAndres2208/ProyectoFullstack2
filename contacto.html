<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="./js/main.js"></script>
    <link rel="icon" type="image/x-icon" href="favicon.jpg">
</head>


<body>

    <header>
        <h1 class="header">Contacto</h1>
    </header>

    <main>
        <div class="row">

            <div class="col-3">
                <nav class="menu">
                    <h2>Menú</h2>

                    <ul>
                        <li><a href="index.html">Inicio</a></li>
                        <li><a href="productos.html">Productos</a></li>
                        <li><a href="carrito.html">Carrito</a></li>
                        <li><a href="contacto.html">Contacto</a></li>
                    </ul>
                </nav>
            </div>

            <div class="col-6">

                <section class="productos">

                    <h2>Formulario de contacto</h2>

                    <form>
                        <form id="form-contacto" novalidate>

                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" name="nombre" autocomplete="name"
                                placeholder="Ingrese su nombre">
                            <p class="error" id="error-nombre"></p>

                            <label for="correo">Correo:</label>
                            <input type="email" id="correo" name="correo" autocomplete="email"
                                placeholder="ejemplo@correo.com">
                            <p class="error" id="error-correo"></p>

                            <label for="telefono">Teléfono:</label>
                            <input type="tel" id="telefono" name="telefono" autocomplete="tel" placeholder="912345678">
                            <p class="error" id="error-telefono"></p>

                            <label for="mensaje">Mensaje:</label>
                            <textarea id="mensaje" name="mensaje" placeholder="Escriba su mensaje"></textarea>
                            <p class="error" id="error-mensaje"></p>

                            <button type="submit">Enviar</button>

                        </form>

                    </form>

                </section>

            </div>

        </div>
    </main>

    <footer>
        <p>Robinson Rodriguez</p>
        <p>Proyecto Fullstack 2026</p>
    </footer>

</body>

</html>
